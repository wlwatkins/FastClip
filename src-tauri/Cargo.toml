[package]
name = "fast-clip"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fast_clip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri-plugin-clipboard-manager = "2.3.2"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
dirs = "6.0.0"
log = "0.4.25"
# Pinned to 0.32 by ADR-0005. Do not bump without re-running the WP-02 spike:
# rusqlite 0.40.1 resolves libsqlite3-sys 0.38.1, whose build script does not
# compile on stable rustc.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile = "3"

